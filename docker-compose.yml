version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GRAPH_MAX_ITERATIONS=${GRAPH_MAX_ITERATIONS:-10}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - DOCKER_ENABLED=${DOCKER_ENABLED:-false}
    volumes:
      - ./output:/app/output
      - ./artifacts:/app/artifacts
      - ./.cache:/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RAG 向量库（可选）
  # chroma:
  #   image: chromadb/chroma:latest
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma

volumes:
  chroma_data:
