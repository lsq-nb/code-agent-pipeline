name: Issue Templates

issue_templates:
  - name: 🐛 Bug Report
    description: 报告一个问题
    titles: "[Bug]: "
    body:
      - type: textarea
        attributes:
          label: 问题描述
          description: 清楚地描述问题
        validations:
          required: true
      - type: textarea
        attributes:
          label: 复现步骤
          description: 复现该问题的步骤
        validations:
          required: true
      - type: textarea
        attributes:
          label: 期望行为
          description: 你期望发生什么
        validations:
          required: true
      - type: input
        attributes:
          label: 环境信息
          description: Python 版本、操作系统等
        validations:
          required: true

  - name: ✨ Feature Request
    description: 提出一个新功能建议
    titles: "[Feature]: "
    body:
      - type: textarea
        attributes:
          label: 功能描述
          description: 你想要什么功能？
        validations:
          required: true
      - type: textarea
        attributes:
          label: 使用场景
          description: 这个功能在什么场景下有用？
        validations:
          required: true
      - type: textarea
        attributes:
          label: 实现方案（可选）
          description: 如果你有实现思路，请描述
        validations:
          required: false
