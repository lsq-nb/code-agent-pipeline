[project]
name = "code-agent-pipeline"
version = "0.1.0"
description = "基于 LangGraph+CrewAI 的全流程代码研发辅助多智能体流水线"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Developer" }
]
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "crewai>=0.100.0",
    "crewai-tools>=0.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "gitpython>=3.1.40",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
run-pipeline = "code_agent_pipeline.cli:main"
serve = "code_agent_pipeline.api.main:serve"
setup = "code_agent_pipeline.cli:setup"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
"code_agent_pipeline/nodes/review_node.py" = ["C901"]
"code_agent_pipeline/rag/indexer.py" = ["C901"]
"code_agent_pipeline/tools/__init__.py" = ["N814"]
"code_agent_pipeline/api/routers/pipeline.py" = ["B904"]
"code_agent_pipeline/models.py" = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
